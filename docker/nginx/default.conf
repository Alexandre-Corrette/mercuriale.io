server {
    listen 80;
    server_name test.mercuriale.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name test.mercuriale.io;
    root /var/www/html/public;

    ssl_certificate /etc/letsencrypt/live/test.mercuriale.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.mercuriale.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;

    # DNS Docker interne : permet de re-résoudre l'upstream php à chaque requête.
    # Sans ça, Nginx fige l'IP de "php:9000" au démarrage → 502 dès que le
    # conteneur php est recréé/redémarré (deploy, restart) et change d'IP.
    resolver 127.0.0.11 valid=10s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/public;
        allow all;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Upstream via variable → force la re-résolution DNS (cf. resolver ci-dessus)
        # au lieu de figer l'IP au chargement de la conf.
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # TLS terminé par Nginx : signaler le HTTPS à PHP pour que Symfony
        # détecte le scheme sécurisé (requis en prod avec cookie_secure: true).
        fastcgi_param HTTPS on;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' blob: data:; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://verify.stripe.com https://api.stripe.com; manifest-src 'self'; worker-src 'self';" always;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Type "application/javascript";
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type "application/manifest+json";
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(env|htaccess|git)$ {
        deny all;
    }

    location ~* (composer\.(json|lock)|package\.json|symfony\.lock)$ {
        deny all;
    }

    location ~ ^/(var|config)/ {
        deny all;
    }

    server_tokens off;

    error_log /var/log/nginx/project_error.log;
    access_log /var/log/nginx/project_access.log;
}
